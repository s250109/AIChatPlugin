# AI chatbot
# Enter your API-Key at api-key. You can get a key at https://console.groq.com/keys .
ai:
  provider: "groq"
  api-key: "YOUR_API_KEY"
  model: "openai/gpt-oss-120b"
  base-url: "https://api.groq.com/openai/v1"
  max-tokens: 300
  cooldown-seconds: 3
  history-size: 10
  request-timeout-seconds: 30
  system-prompt: "You are a helpful assistant on a Minecraft server. Always reply in the language the player writes , keep answers short (maximum 3 sentences), be friendly, and do not use Markdown. You can use Kaomojis. But nt often. Sometimes. And remember everything the player said. And even if it has nothing to do with Minecraft, answer it. Be like a sweet girl. "
messages:
  prefix: "&8[&bAI&8] &r"
  usage: "&eUse: /ai <text>"
  thinking: "&7AI is thinking..."
  error: "&cThe AI ​​is currently unavailable. Please try again later."
  cooldown: "&cPlease wait {seconds} Seconds."
  no-permission: "&cYou don't have permissions to do that."
  reloaded: "&aSuccesfully reloaded."

# AI Map generation
# Enter your API-Token at api-token. You can get a key at https://dash.cloudflare.com/b9f2234aa3406cf786b341cc9e99547e/ai/workers-ai/api-quick-start . You also need the Account ID.
aimap:
  enabled: true
  cloudflare:
    account-id: "YOUR_ACCOUNT_ID"
    api-token: "YOUR_CLOUDFLARE_TOKEN"
    model: "@cf/bytedance/stable-diffusion-xl-lightning"
  system-prompt: "You are a helpful picture generator on a Minecraft server. Generate always cute and nice pictures. And do so good as possible."
  cooldown-seconds: 30

# AI Music generation
aimusic:
  enabled: true
  provider: "cloudflare"
  cloudflare:
    account-id: "YOUR_ACCOUNT_ID"
    api-token: "YOUR_CLOUDFLARE_TOKEN"
    model: "elevenlabs/music-v2"
  cooldown-seconds: 60
  request-timeout-seconds: 120
